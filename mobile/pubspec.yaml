name: shadow_mobile
description: Shadow Browser - Mobile App (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Solana
  solana: ^0.31.0+1
  ed25519_edwards: ^0.3.1
  bs58: ^1.0.2
  bip39: ^1.0.6

  # Crypto & Storage
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  # X25519 and XChaCha20-Poly1305 for sealing mail to a per-site key.
  # pointycastle has no Curve25519 at all — only short-Weierstrass curves —
  # and hand-writing constant-time field arithmetic is the last thing that
  # should be hand-written. This package is ALREADY in the tree, pulled in
  # transitively by solana, and it is plain Dart with no `flutter:` section,
  # so nothing enters the CocoaPods graph and iOS stays buildable in CI.
  # Declared directly because importing a transitive-only package trips
  # depend_on_referenced_packages, which is info-level and therefore breaks
  # the required clean `flutter analyze`. Pinned exactly: upstream
  # maintenance is intermittent and this sits under the mailbox.
  # Do NOT add cryptography_flutter — that one IS a plugin.
  cryptography: 2.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  # Device biometric or PIN, used only to gate reading a stored passphrase.
  local_auth: ^2.3.0

  # State Management
  provider: ^6.1.1

  # Routing
  go_router: ^14.2.7

  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  qr_flutter: ^4.1.0

  # Browsing
  webview_flutter: ^4.14.1
  # Imported directly for AndroidWebViewController.webViewIdentifier, which
  # the tracker-blocking bridge needs to find the native WebView. Already in
  # the tree as webview_flutter's own Android implementation.
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # File picking (deploy website)
  file_picker: ^8.0.6

  # Additional utilities
  intl: ^0.19.0
  logger: ^2.3.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/illustrations/
    - assets/gods/
    - assets/blocklist/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
