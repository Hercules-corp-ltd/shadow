name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in step with the toolchain used locally; the theme APIs this app
  # relies on (CardThemeData and friends) do not exist before 3.32.
  FLUTTER_VERSION: "3.41.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Rust backend: format check + clippy + tests (DB tests are #[ignore]d)
  # ----------------------------------------------------------------------
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/hermes-cli
            crates/hermes-client

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        # fmt is advisory for now — repo isn't fully formatted yet.
        continue-on-error: true

      - name: cargo clippy
        run: cargo clippy -p shadow-backend --all-targets
        continue-on-error: true

      - name: cargo build
        run: cargo build -p shadow-backend --verbose

      - name: cargo test
        run: cargo test -p shadow-backend --verbose

  # ----------------------------------------------------------------------
  # Flutter mobile: pub get + analyze + unit/widget tests
  # ----------------------------------------------------------------------
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter=expanded

  # ----------------------------------------------------------------------
  # Android: assemble a debug APK.
  #
  # The Gradle path in this project had never been executed by anything —
  # no CI job, no local build (there is no JDK on the dev machine). This is
  # the first thing that compiles it, and it catches the class of failure
  # `flutter analyze` cannot see: manifest merge conflicts, NDK and SDK
  # mismatches, plugin minSdk floors, and AGP/Kotlin drift.
  # ----------------------------------------------------------------------
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.11 requires 17+; the app compiles Java and Kotlin at 17.
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report APK size
        run: du -h build/app/outputs/flutter-apk/app-debug.apk

  # ----------------------------------------------------------------------
  # iOS: compile the real app on a macOS runner, unsigned.
  #
  # Development happens on Windows, where `flutter build ios` cannot run at
  # all. This job is the only thing standing between "it analyzes" and "it
  # actually builds for a device", so it must stay green — it catches
  # CocoaPods resolution, deployment-target mismatches and Info.plist errors
  # that no amount of `flutter analyze` will ever surface.
  # ----------------------------------------------------------------------
  ios:
    name: iOS (unsigned build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Show pod environment
        run: pod --version

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Report app size
        run: du -sh build/ios/iphoneos/Runner.app

      # Unsigned, so this cannot be installed on a device as-is — it needs
      # re-signing first. Uploaded so the build can at least be inspected
      # without a Mac, which is otherwise impossible from this project's
      # development machine.
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-app
          path: mobile/build/ios/iphoneos/Runner.app
          retention-days: 7
