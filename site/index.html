<body class="is-loading">

<!--
  Two mechanisms carry this page.

  1. There is no native scroll. The document is one viewport, the wheel is
     consumed, and the scroll position is a float we own. That is what lets the
     loop wrap without a seam.

  2. The camera. Everything in the hero lives inside `#scene`, and scrolling
     applies ONE transform to it — a scale about the phone's centre. So the
     headline grows and slides off the edge exactly as the phone grows, the way
     it would through a lens. The phone's screen is a window onto the rest of
     the page, which is really there the whole time at 1/Z scale; when the
     camera has pushed in far enough that Z cancels, it is life size.

  It is all real, selectable, crawlable DOM. The site whose technique this
  borrows renders its hero — headline, buttons and all — inside WebGL as MSDF
  text, which looks superb and is invisible to a search engine, a screen reader
  and anyone who has asked for reduced motion. For a page whose only job is to
  hand over a download, that trade is the wrong way round.
-->

<div class="grid" aria-hidden="true"></div>

<div class="scene" id="scene">
  <div class="column">

    <header class="topbar">
      <a class="topbar__brand" href="#">
        <img src="assets/brand/shadow-mark.png" alt="" width="22" height="22">

      <nav class="topbar__nav" aria-label="Site">

        <span class="topbar__slash" aria-hidden="true">/</span>
        <a href="https://github.com/Hercules-corp-ltd/shadow" rel="noopener">Source</a>
      </nav>
    </header>

    <div class="hero">
      <div class="hero__copy">
        <h1 class="hero__title">Forget me,<br>on&nbsp;purpose.</h1>

        <p class="lead">
          One phrase becomes your wallet, a different password for every site,
          and a different address for every sign-up. None of it is stored —
          Shadow works it out again each time you unlock.
        </p>

        <div class="cta" id="cta"></div>
        <p class="cta__note">Free. No account. Nothing to sign up for.</p>
      </div>

      <!--
        The phone. Its screen is `#card`, which is the camera's focal point and
        the opening the rest of the page is seen through.
      -->
      <div class="phone">
        <div class="phone__glow" aria-hidden="true"></div>
        <div class="phone__body">
          <!--
            By id, both of them. The last stage holds a deep clone of this whole
            column, and the camera's `querySelectorAll('.phone__frame, …')` ran
            AFTER the reel was appended to the plane — so it matched six
            elements, not three, and drove the miniature phone inside the page
            with the same scale as the real one. Ids are stripped from the clone
            when it is built, so getElementById can only ever reach these.

            .phone__screen used to sit here. It has no rule in styles.css at
            all, so it computed to display:inline with a 0x0 box — and a
            non-replaced inline element is not transformable. The scale the
            camera wrote to it every frame has never done anything.
          -->
          <span class="phone__frame" id="phoneFrame" aria-hidden="true"></span>
          <div class="card" id="card">
            <main class="plane" id="plane"></main>
            <img class="card__shot" id="cardShot" src="assets/shots/home.png" alt="Shadow's home screen: an arched recess with a search slot beneath it." width="1080" height="2400">
            <!--
              The reflection is on the glass, so it lives INSIDE the glass. It
              was a sibling at inset:6px — the same box to the pixel, measured
              175.19x403.97 at (791.81, 177.52) — but nothing clipped it there,
              and a highlight that may not fade has to be able to slide out of
              frame.
            -->
            <span class="phone__gloss" id="phoneGloss" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
